[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wre"
version = "0.0.1"
description = "Benchmark: do LLMs pass behavioral-economics tests by reasoning or by recognition?"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]
run = ["openai", "anthropic", "python-dotenv"]
plots = ["matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
